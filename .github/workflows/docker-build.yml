name: Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds both images on every change so a broken Dockerfile or a dependency that
# stops resolving gets caught here rather than on someone else's machine.
jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Building is not the same as running, so bring the stack up and talk to it.
  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for both services to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8001/health \
               && curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 5
          done
          echo "the stack never came up"
          exit 1

      - name: Check the frontend proxies through to the backend
        run: curl -fsS http://127.0.0.1:3000/api/projects/

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
